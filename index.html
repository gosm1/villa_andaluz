<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Villa Andaluz · Private Villa with Pool in Cabo Negro, Tétouan</title>
    <meta
      name="description"
      content="Villa Andaluz is a modern 3 000 m² villa with a private pool in Cabo Negro, Tétouan. Five bedrooms, five bathrooms and three lounges, sleeping thirteen. Book direct with the host, no booking fees."
    />
    <meta name="author" content="Villa Andaluz" />
    <meta name="theme-color" content="#efebe4" />

    <!-- Absolute URL of the production site. If the domain changes, change it
         here, in SITE_URL in src/data/villa.js, and in public/sitemap.xml. -->
    <link rel="canonical" href="https://villaandaluz.ma/" />

    <!-- Link previews: WhatsApp, Facebook, LinkedIn, iMessage. The image must
         be JPEG or PNG at an absolute URL — social scrapers do not decode the
         AVIF photos the site itself uses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Villa Andaluz" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://villaandaluz.ma/" />
    <meta property="og:title" content="Villa Andaluz · Private Villa with Pool in Cabo Negro" />
    <meta
      property="og:description"
      content="A modern 3 000 m² villa with private pool in Cabo Negro, Tétouan. Five bedrooms, sleeps thirteen. Book direct with the host."
    />
    <meta property="og:image" content="https://villaandaluz.ma/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The villa and its private pool, seen across the garden" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Villa Andaluz · Private Villa with Pool in Cabo Negro" />
    <meta
      name="twitter:description"
      content="A modern 3 000 m² villa with private pool in Cabo Negro, Tétouan. Five bedrooms, sleeps thirteen."
    />
    <meta name="twitter:image" content="https://villaandaluz.ma/og-image.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data. Lets Google show the rating, location and capacity as
         a rich result rather than a plain blue link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "@id": "https://villaandaluz.ma/#villa",
        "name": "Villa Andaluz",
        "description": "A modern 3 000 m² villa with private pool in Cabo Negro, Tétouan. Five bedrooms, five bathrooms and three lounges, sleeping thirteen guests.",
        "url": "https://villaandaluz.ma/",
        "image": "https://villaandaluz.ma/og-image.jpg",
        "telephone": "+212661102945",
        "email": "hello@villaandaluz.ma",
        "priceRange": "$$$",
        "petsAllowed": false,
        "numberOfRooms": 5,
        "maximumAttendeeCapacity": 13,
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cabo Negro",
          "addressRegion": "Tanger-Tétouan-Al Hoceïma",
          "addressCountry": "MA"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 35.6539183,
          "longitude": -5.2989997
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "reviewCount": 15,
          "bestRating": "5"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Private pool", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Free parking", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Air conditioning", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Garden", "value": true }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
